name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-2025-vs2026
            args: --target x86_64-pc-windows-msvc --bundles nsis
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          export NEEDRESTART_SUSPEND=1
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo -E apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch sidecar binaries
        shell: bash
        run: pnpm fetch-sidecars "${{ matrix.target }}"

      - name: Build native messaging launcher
        run: pnpm build:native-launcher

      - name: Build and publish installer
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signatures (optional). Leave unset to skip updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID + notarization (optional). Do not commit certificate material.
          # Empty secrets keep ad-hoc signing from tauri.conf.json (`signingIdentity: "-"`).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: false
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Verify bundled macOS sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/verify-macos-sidecars.sh "${{ matrix.target }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: motrix-zj-${{ matrix.label }}
          path: "${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}"
          if-no-files-found: error
          retention-days: 14
